version: '3.8'

services:
  # FastAPI backend — AKSI API, health, proof, logs, metrics, crypto, AI sessions
  milana-backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  # Milana frontend — 21 AI mini-apps portal served by nginx
  milana-frontend:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - milana-backend
    restart: unless-stopped

  # AKSI Globe — real-time 3D Earth visualization with AI objects
  aksi-globe:
    build:
      context: ./aksi-globe
      dockerfile: backend/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
    restart: unless-stopped
