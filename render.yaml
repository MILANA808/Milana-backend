services:
  - type: web
    name: aksi-backend
    runtime: docker
    plan: free
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: AKSI_CORS_ORIGINS
        value: "https://milana808.github.io"
      - key: RESONANCE_SEED
        value: AKSI_DIMAX_v3_2026
      - key: AKSI_ADMIN_TOKEN
        generateValue: true
      - key: XAI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: XAI_MODEL
        value: grok-3
      - key: OPENAI_MODEL
        value: gpt-4o-mini
