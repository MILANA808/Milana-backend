server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve Milana frontend static files
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy requests to FastAPI backend
    location /api/ {
        proxy_pass http://milana-backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy AKSI endpoints to FastAPI backend
    location /aksi/ {
        proxy_pass http://milana-backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /health {
        proxy_pass http://milana-backend:8000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /version {
        proxy_pass http://milana-backend:8000/version;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
