name: AKSI backend deploy check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -r requirements.txt
      - name: Compile
        run: python -m compileall -q main.py app aksi aksi_kernel.py
      - name: AKSI numerical-kernel demo and proof self-check
        run: |
          python aksi_kernel.py | tee aksi-kernel-demo.log
          grep -q 'status: ✓ verified' aksi-kernel-demo.log
          grep -q 'proof self-check: True' aksi-kernel-demo.log
          grep -q 'Stable: True' aksi-kernel-demo.log
      - name: Health contract
        run: |
          python - <<'PY' > backend-diagnostics.json 2>&1
          import json
          try:
              import main
              app=main.app
              routes=sorted({getattr(r,"path","") for r in app.routes})
              print(json.dumps({"routes":routes,"routers":getattr(main,"ROUTERS",[]),"router_errors":getattr(main,"ROUTER_ERRORS",{})},ensure_ascii=False,indent=2))
              assert app.title
              assert "/health" in routes
              assert "/api/agent/tasks" in routes
              assert "/api/agent/browser/sessions" in routes
              assert "/api/core/runtime" in routes
              assert "/api/discovery/plan" in routes
              assert "/api/aksi/kernel/health" in routes
              assert "/api/aksi/kernel/calculate" in routes
              print("AKSI backend contract PASS")
          except Exception as exc:
              print(json.dumps({"import_or_contract_error":type(exc).__name__,"error":str(exc)},ensure_ascii=False,indent=2))
              raise
          PY
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-diagnostics
          path: |
            backend-diagnostics.json
            aksi-kernel-demo.log
          if-no-files-found: ignore
