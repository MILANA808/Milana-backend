name: AKSI backend deploy check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -r requirements.txt
      - name: Compile
        run: python -m compileall -q main.py app aksi
      - name: Health contract
        run: |
          python - <<'PY'
          import json
          from main import app, ROUTER_ERRORS
          routes = sorted({getattr(r, "path", "") for r in app.routes})
          import importlib
          modules = {}
          for name in ["app.api.web_agent","app.api.browser_agent","app.api.core","app.api.discovery","app.api.opportunity"]:
              try:
                  m=importlib.import_module(name); r=getattr(m,"router",None)
                  modules[name]={"router_type":type(r).__name__ if r is not None else None,"router_routes":len(getattr(r,"routes",[])) if r is not None else 0}
              except Exception as exc:
                  modules[name]={"error_type":type(exc).__name__,"error":str(exc)}
          diagnostics = {"routes": routes, "router_errors": ROUTER_ERRORS, "critical_modules": modules}
          open("backend-diagnostics.json", "w", encoding="utf-8").write(json.dumps(diagnostics, ensure_ascii=False, indent=2))
          print(json.dumps(diagnostics, ensure_ascii=False, indent=2))
          assert app.title
          assert "/health" in routes
          assert "/api/agent/tasks" in routes
          print("AKSI backend contract PASS")
          PY
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-diagnostics
          path: backend-diagnostics.json
          if-no-files-found: ignore
