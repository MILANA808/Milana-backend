name: AKSI live backend smoke

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wait for Render deploy and probe public API
        env:
          AKSI_BASE_URL: https://aksi-backend.onrender.com
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import time
          import urllib.error
          import urllib.request

          base = os.environ["AKSI_BASE_URL"].rstrip("/")
          checks = {
              "/health": lambda d: d.get("status") == "healthy",
              "/ready": lambda d: d.get("ready") is True,
              "/aksi/cluster/status": lambda d: d.get("kind") == "classical-cpu-simulation",
              "/api/core/runtime": lambda d: d.get("ok") is True,
          }
          failures = {}
          for attempt in range(1, 11):
              failures = {}
              print(f"Probe attempt {attempt}/10: {base}")
              for path, validate in checks.items():
                  try:
                      req = urllib.request.Request(
                          base + path,
                          headers={"User-Agent": "AKSI-live-smoke/1.0", "Accept": "application/json"},
                      )
                      with urllib.request.urlopen(req, timeout=20) as response:
                          payload = json.loads(response.read().decode("utf-8"))
                          if response.status != 200 or not validate(payload):
                              failures[path] = {
                                  "http_status": response.status,
                                  "body": payload,
                                  "reason": "response did not satisfy endpoint contract",
                              }
                          else:
                              print(f"PASS {path} ({response.status})")
                  except Exception as exc:
                      failures[path] = {"error": type(exc).__name__, "message": str(exc)[:300]}
              if not failures:
                  print("AKSI LIVE BACKEND: ALL CHECKS PASSED")
                  sys.exit(0)
              print(json.dumps(failures, ensure_ascii=False, indent=2))
              if attempt < 10:
                  time.sleep(30)
          print("AKSI LIVE BACKEND: FAILED after retries")
          sys.exit(1)
          PY
