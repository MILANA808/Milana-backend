name: AKSI Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Compile Python modules
        run: python -m compileall -q main.py app tests
      - name: Run tests
        env:
          AKSI_TASK_DB: /tmp/aksi-ci.sqlite3
        run: PYTHONPATH=. pytest -q tests
      - name: Import application
        env:
          AKSI_TASK_DB: /tmp/aksi-ci-import.sqlite3
        run: python -c "import main; print(main.VERSION); print(main.ROUTERS)"
